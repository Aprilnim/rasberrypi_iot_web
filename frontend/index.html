<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL40 监控台</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme");
            const systemLight = window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: light)").matches;
            document.body.dataset.theme = savedTheme || (systemLight ? "light" : "dark");
        })();
    </script>
    <div class="container">
        <header class="page-header">
            <div class="header-left">
                <h1>YL-40 传感器监控台</h1>
                <p class="subtitle">物联网实时数据面板</p>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换浅色模式">
                    <span class="theme-icon" id="theme-icon">☀</span>
                    <span id="theme-label">浅色</span>
                </button>
                <div class="device-badge" id="device-badge">
                    <span class="badge-dot"></span>
                    <span id="device-status">检测中...</span>
                </div>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- 第一行：传感器(2列) + LED(1列) + 风扇(1列) -->
            <section class="card card-col-2">
                <div class="card-header">
                    <h2>传感器数据</h2>
                    <span class="live-badge">LIVE</span>
                </div>
                <div class="metrics-grid metrics-large">
                    <div class="metric-box">
                        <div class="metric-icon">🌡</div>
                        <div class="metric-data">
                            <span class="metric-value" id="temp">--</span>
                            <span class="metric-unit">℃</span>
                        </div>
                        <div class="metric-label">环境温度</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-icon">☀</div>
                        <div class="metric-data">
                            <span class="metric-value" id="light">--</span>
                            <span class="metric-unit">%</span>
                        </div>
                        <div class="metric-label">光照强度</div>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>LED 控制</h2>
                </div>
                <div class="control-panel">
                    <div class="control-visual">
                        <div class="led-glow" id="led-glow"></div>
                        <div class="led-bulb" id="led-bulb"></div>
                    </div>
                    <div class="control-info">
                        <div class="control-state-row">
                            <span class="control-state" id="led-status">--</span>
                            <span class="control-pin">GPIO 18</span>
                        </div>
                        <div class="control-meta">
                            最近操作：<span id="led-last-time">--</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="led-switch">
                        <span class="slider"></span>
                    </label>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>风扇控制</h2>
                </div>
                <div class="control-panel">
                    <div class="control-visual">
                        <div class="fan-glow" id="fan-glow"></div>
                        <div class="fan-icon" id="fan-bulb">🌀</div>
                    </div>
                    <div class="control-info">
                        <div class="control-state-row">
                            <span class="control-state" id="fan-status">--</span>
                            <span class="control-pin">GPIO 17</span>
                        </div>
                        <div class="control-meta">
                            最近操作：<span id="fan-last-time">--</span>
                        </div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="fan-switch">
                        <span class="slider"></span>
                    </label>
                </div>
            </section>

            <!-- 第二行：系统信息(1列) + 通信状态(1列) + 设备概览(2列) -->
            <section class="card">
                <div class="card-header">
                    <h2>系统信息</h2>
                </div>
                <div class="info-list">
                    <div class="info-row">
                        <span class="info-key">设备型号</span>
                        <span class="info-val">YL-40</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">传感器</span>
                        <span class="info-val">PCF8591</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">主控</span>
                        <span class="info-val">Raspberry Pi</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">固件版本</span>
                        <span class="info-val">v1.2.0</span>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="card-header">
                    <h2>通信状态</h2>
                </div>
                <div class="info-list">
                    <div class="info-row">
                        <span class="info-key">LoRa 连接</span>
                        <span class="info-val" id="lora-status">检测中...</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">心跳间隔</span>
                        <span class="info-val">3 秒 / 次</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">数据刷新</span>
                        <span class="info-val">1 秒 / 次</span>
                    </div>
                    <div class="info-row">
                        <span class="info-key">通信协议</span>
                        <span class="info-val">I2C + LoRa</span>
                    </div>
                </div>
            </section>

            <section class="card card-col-2">
                <div class="card-header">
                    <h2>设备概览</h2>
                </div>
                <div class="overview-grid">
                    <div class="overview-item">
                        <span class="overview-label">后端服务</span>
                        <span class="overview-value" id="backend-status">连接中...</span>
                    </div>
                    <div class="overview-item">
                        <span class="overview-label">设备状态</span>
                        <span class="overview-value" id="overview-device-status">检测中...</span>
                    </div>
                    <div class="overview-item">
                        <span class="overview-label">最近更新</span>
                        <span class="overview-value" id="last-update-time">--</span>
                    </div>
                    <div class="overview-item">
                        <span class="overview-label">系统运行</span>
                        <span class="overview-value" id="uptime">--</span>
                    </div>
                </div>
            </section>

            <!-- 第三行：日志占满整行 -->
            <section class="card log-card">
                <div class="card-header">
                    <h2>操作日志</h2>
                    <button class="clear-btn" id="clear-log">清空</button>
                </div>
                <div class="log-list" id="log-list"></div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
