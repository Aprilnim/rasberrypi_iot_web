services:
  # MQTT 模式下 FastAPI 只访问 MQTT 和 SQLite，移除全部硬件设备权限。
  backend:
    devices: !reset []
    group_add: !reset []
    environment:
      - DEVICE_TRANSPORT=mqtt

  lora-gateway:
    build: ./lora_gateway
    container_name: yl40-lora-gateway

    devices:
      - "/dev/ttyS0:/dev/ttyS0"
      - "/dev/gpiomem:/dev/gpiomem"
      # rpi-lgpio/lgpio 通过 Linux gpiochip 访问 GPIO，不只依赖 /dev/gpiomem。
      - "/dev/gpiochip0:/dev/gpiochip0"

    volumes:
      - "/proc/device-tree:/proc/device-tree:ro"
      - "/sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro"

    group_add:
      - "986"
      - "20"

    environment:
      - MQTT_HOST=${MQTT_HOST:-192.168.10.70}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_GATEWAY_USERNAME=${MQTT_GATEWAY_USERNAME:-lora-gateway}
      - MQTT_GATEWAY_PASSWORD=${MQTT_GATEWAY_PASSWORD:-}
      - LORA_HMAC_SECRET=${LORA_HMAC_SECRET:-}
      # rpi-lgpio 在 Docker 内可能读不到 /proc/device-tree/system/linux,revision，
      # 显式提供 Pi 4 revision，避免误判为“不是 Raspberry Pi”。
      - RPI_LGPIO_REVISION=${RPI_LGPIO_REVISION:-c03115}

    restart: unless-stopped
